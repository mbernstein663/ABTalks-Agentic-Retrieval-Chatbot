apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: abtalksai-cohort-frontend:k8s-20261028
          imagePullPolicy: Never

          ports:
            - containerPort: 8501

          env:
            - name: BACKEND_URL
              value: "http://backend:8000"