apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: abtalksai-cohort-backend:k8s-20261028
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: backend-secrets

          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.minikube.internal:11435"
            - name: OLLAMA_HOST
              value: "http://host.minikube.internal:11435"
            - name: LANGFUSE_HOST
              value: "http://host.docker.internal:3000"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3