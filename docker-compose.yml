services:


  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env
    
    environment:
      OLLAMA_HOST: http://ollama:11434

    volumes:
      - ./chroma_db:/app/chroma_db

    depends_on:
      - ollama

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  chroma_data:
  ollama_data: